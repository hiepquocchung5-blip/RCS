name: RCS CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-and-typecheck:
    name: Test & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Typechecks
        run: npm run typecheck

      - name: Run Tests
        run: npm run test

  deploy:
    name: Deploy to Production
    needs: test-and-typecheck
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Check SSH Secrets Availability
        id: check_secrets
        env:
          SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
        run: |
          if [ -z "$SSH_HOST" ]; then
            echo "has_ssh=false" >> $GITHUB_OUTPUT
            echo "::notice ::VPS_SSH_HOST secret is not set. Add VPS_SSH_HOST, VPS_SSH_USER, and VPS_SSH_KEY in Repository Settings -> Secrets to enable automated remote deployment."
          else
            echo "has_ssh=true" >> $GITHUB_OUTPUT
          fi

      - name: Execute Remote SSH Commands to Deploy
        if: steps.check_secrets.outputs.has_ssh == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "==> Pulling latest changes..."
            cd /opt/rcs
            git pull origin main
            
            echo "==> Installing dependencies and building..."
            npm ci
            NEXT_PUBLIC_RCS_API=https://risecorestudio.com/api NEXT_PUBLIC_RCS_COOKIE_DOMAIN=risecorestudio.com npm run build
            
            echo "==> Restarting PM2 services..."
            pm2 restart rcs-api rcs-web --update-env
