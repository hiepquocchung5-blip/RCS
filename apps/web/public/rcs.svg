<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <defs>
    <!-- Dark Radial Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#16192b" />
      <stop offset="60%" stop-color="#0b0d17" />
      <stop offset="100%" stop-color="#05060a" />
    </radialGradient>

    <!-- Premium Metallic Gradient for the main RCS text -->
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="20%" stop-color="#a0aabf" />
      <stop offset="45%" stop-color="#4a4e59" />
      <stop offset="50%" stop-color="#1a1d27" />
      <stop offset="55%" stop-color="#323642" />
      <stop offset="80%" stop-color="#8c95a6" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Neon Cyan Glitch Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f7ff" />
      <stop offset="100%" stop-color="#0088ff" />
    </linearGradient>

    <!-- Neon Magenta Glitch Gradient -->
    <linearGradient id="magentaGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff007f" />
      <stop offset="100%" stop-color="#9900ff" />
    </linearGradient>

    <!-- Glowing Drop Shadow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComponentTransfer in="blur" result="brightBlur">
        <feFuncA type="linear" slope="1.5"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="brightBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Cyber Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00f7ff" stroke-width="0.5" stroke-opacity="0.07" />
    </pattern>

    <!-- Glitch Slices (Clip Paths) -->
    <clipPath id="slice1"><rect x="0" y="60" width="800" height="24" /></clipPath>
    <clipPath id="slice2"><rect x="0" y="105" width="800" height="16" /></clipPath>
    <clipPath id="slice3"><rect x="0" y="145" width="800" height="30" /></clipPath>
    <clipPath id="slice4"><rect x="0" y="195" width="800" height="20" /></clipPath>
    <clipPath id="slice5"><rect x="0" y="230" width="800" height="12" /></clipPath>

    <!-- Reusable Text Element for the main logo mark -->
    <g id="rcs-mark">
      <text x="400" y="240" 
            font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Arial Black', Impact, sans-serif" 
            font-size="190" 
            font-weight="900" 
            letter-spacing="-4" 
            text-anchor="middle">RCS</text>
    </g>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" fill="url(#bgGrad)" />
  <rect width="800" height="400" fill="url(#grid)" />

  <!-- Sci-Fi Decorative Framing Elements -->
  <g stroke="#00f7ff" stroke-opacity="0.25" stroke-width="1.5" fill="none">
    <!-- Top Left Corner -->
    <path d="M 30 60 L 30 30 L 60 30" />
    <circle cx="30" cy="30" r="3" fill="#00f7ff" fill-opacity="0.5" />
    
    <!-- Top Right Corner -->
    <path d="M 770 60 L 770 30 L 740 30" />
    <circle cx="770" cy="30" r="3" fill="#00f7ff" fill-opacity="0.5" />
    
    <!-- Bottom Left Corner -->
    <path d="M 30 340 L 30 370 L 60 370" />
    <circle cx="30" cy="370" r="3" fill="#00f7ff" fill-opacity="0.5" />
    
    <!-- Bottom Right Corner -->
    <path d="M 770 340 L 770 370 L 740 370" />
    <circle cx="770" cy="370" r="3" fill="#00f7ff" fill-opacity="0.5" />

    <!-- Horizontal Tech Accents -->
    <line x1="80" y1="30" x2="250" y2="30" stroke-dasharray="4 4" />
    <line x1="550" y1="370" x2="720" y2="370" stroke-dasharray="4 4" />
  </g>

  <!-- Glitch Layer 1: Cyan Shift (Left & Down) -->
  <g fill="url(#cyanGrad)" transform="translate(-7, 3)" filter="url(#cyanGlow)" opacity="0.85">
    <use href="#rcs-mark" clip-path="url(#slice1)" />
    <use href="#rcs-mark" clip-path="url(#slice3)" />
    <use href="#rcs-mark" clip-path="url(#slice5)" />
  </g>

  <!-- Glitch Layer 2: Magenta Shift (Right & Up) -->
  <g fill="url(#magentaGrad)" transform="translate(6, -4)" filter="url(#neonGlow)" opacity="0.85">
    <use href="#rcs-mark" clip-path="url(#slice2)" />
    <use href="#rcs-mark" clip-path="url(#slice4)" />
  </g>

  <!-- Ambient Glow Behind Main Text -->
  <g fill="none" stroke="#00f7ff" stroke-width="4" opacity="0.3" filter="url(#neonGlow)">
    <use href="#rcs-mark" />
  </g>

  <!-- Base Main Metallic Text Layer -->
  <g fill="url(#metalGrad)" stroke="#1a1d27" stroke-width="2">
    <use href="#rcs-mark" />
  </g>

  <!-- Crisp Metallic Highlight Overlay -->
  <g fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.4">
    <use href="#rcs-mark" />
  </g>

  <!-- Futuristic Subtext / Tagline -->
  <text x="400" y="295" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="14" 
        font-weight="600" 
        letter-spacing="12" 
        fill="#00f7ff" 
        fill-opacity="0.8" 
        text-anchor="middle">RISE CORE STUDIO</text>

  <!-- Subtle Horizontal Scanline Glitch Slice Lines -->
  <line x1="100" y1="113" x2="700" y2="113" stroke="#00f7ff" stroke-width="1" stroke-opacity="0.4" />
  <line x1="50" y1="160" x2="750" y2="160" stroke="#ff007f" stroke-width="1" stroke-opacity="0.3" />
</svg>
