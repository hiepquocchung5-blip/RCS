<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline | RiseCoreStudio</title>
  <style>
    :root {
      --bg: #090d16;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #10b981;
      --gold: #f59e0b;
      --border: rgba(255, 255, 255, 0.1);
    }
    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .card {
      max-width: 420px;
      padding: 2.5rem;
      border-radius: 1rem;
      border: 1px solid var(--border);
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(12px);
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .badge {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      font-family: monospace;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--gold);
      border: 1px solid rgba(245, 158, 11, 0.3);
      border-radius: 9999px;
      margin-bottom: 1.5rem;
    }
    h1 {
      font-size: 1.75rem;
      margin: 0 0 0.75rem 0;
    }
    p {
      color: var(--muted);
      font-size: 0.875rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    button {
      background-color: var(--accent);
      color: var(--bg);
      border: none;
      padding: 0.75rem 1.75rem;
      font-size: 0.875rem;
      font-weight: 600;
      border-radius: 9999px;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">Offline Shell</div>
    <h1>You are offline</h1>
    <p>RiseCoreStudio requires an internet connection to sync real-time project boards and chat streams. Check your network and try again.</p>
    <button onclick="window.location.reload()">Retry Connection</button>
  </div>
</body>
</html>
