# Main domain
server {
    server_name risecorestudio.com www.risecorestudio.com apisuro.online www.apisuro.online;

    location /api/ {
        proxy_pass http://127.0.0.1:4000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen [::]:443 ssl ipv6only=on;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/risecorestudio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/risecorestudio.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# HTTP → HTTPS redirects
server {
    if ($host = www.risecorestudio.com) {
        return 301 https://$host$request_uri;
    }
    if ($host = risecorestudio.com) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    listen [::]:80;
    server_name risecorestudio.com www.risecorestudio.com apisuro.online www.apisuro.online;
    return 404;
}
server {
    if ($host = api.risecorestudio.com) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    listen [::]:80;
    server_name api.risecorestudio.com;
    return 404;
}
server {
    if ($host = auth.risecorestudio.com) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    listen [::]:80;
    server_name auth.risecorestudio.com;
    return 404;
}
server {
    if ($host = stock.risecorestudio.com) {
